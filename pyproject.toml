[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purffle-shorts"
version = "2.0.0"
description = "Free, open-source AI YouTube Shorts generator and upload autopilot: any LLM writes the script, free neural voices, stock footage or AI images, word-synced captions, ffmpeg render, auto-upload and scheduling."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Chaman Raj" }]
requires-python = ">=3.10"
keywords = [
    "youtube shorts", "youtube shorts generator", "youtube automation", "ai video generator", "text to video",
    "faceless youtube", "shorts maker", "tiktok", "instagram reels", "llm", "openai", "claude", "gemini", "ollama",
    "text to speech", "edge-tts", "captions", "ffmpeg", "automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "Pillow>=10.1",
    "edge-tts>=7.0",
    "imageio-ffmpeg>=0.5",
    "tzdata; sys_platform == 'win32'",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "anthropic>=1.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]
coqui = ["coqui-tts>=0.24"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
purffle-shorts = "purffle_shorts.cli:main"

[project.urls]
Homepage = "https://purffle.com/purffle-shorts/"
Source = "https://github.com/Chamanrajragu/purffle-shorts"
Issues = "https://github.com/Chamanrajragu/purffle-shorts/issues"
Changelog = "https://github.com/Chamanrajragu/purffle-shorts/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["purffle_shorts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
