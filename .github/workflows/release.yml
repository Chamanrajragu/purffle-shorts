name: Release

# Runs when a GitHub release is published: builds the package, publishes it to PyPI (Trusted
# Publishing, no token stored anywhere), lists the MCP server in the official MCP Registry and pushes
# a Docker image to GHCR. The file name (release.yml) and the environment name (pypi) must match the
# "pending publisher" entered on PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Tag must match the package version
        if: github.event_name == 'release'
        run: |
          V="${GITHUB_REF_NAME#v}"
          test -f "dist/purffle_shorts-${V}.tar.gz" || { echo "Tag ${GITHUB_REF_NAME} does not match the built version:"; ls dist; exit 1; }
      - name: README carries the MCP Registry ownership marker
        run: |
          grep -q "mcp-name: io.github.Chamanrajragu/purffle-shorts" README.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/purffle-shorts
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait until PyPI serves this version
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/purffle-shorts/${V}/json" > /dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not show purffle-shorts ${V} yet"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Set the release version in server.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chamanrajragu/purffle-shorts
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
